bfa99;border-radius:14px;background:#0b1220eF;box-shadow:0 10px 35px #0008;backdrop-filter:blur(8px)}.fs-chat-overlay iframe{display:block;width:100%;height:100%;border:0}.fs-chat-label{position:absolute;top:0;left:0;z-index:2;padding:5px 9px;color:#fff;background:#6d28d9e8;border-radius:0 0 9px 0;font-size:10px;font-weight:900;pointer-events:none}

  <script>
  "use strict";

  const THEME_KEY = "sls_theme_preference";
  const themeToggle = document.getElementById("themeToggle");
  const themeLabel = document.getElementById("themeLabel");
  const themeMeta = document.querySelector('meta[name="theme-color"]');

  function applyTheme(theme) {
    const selected = theme === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = selected;
    if (themeLabel) themeLabel.textContent = selected === "dark" ? "Dark" : "Light";
    if (themeToggle) {
      themeToggle.setAttribute("aria-pressed", String(selected === "dark"));
      themeToggle.setAttribute(
        "aria-label",
        selected === "dark" ? "Switch to light mode" : "Switch to dark mode"
      );
    }
    if (themeMeta) themeMeta.content = selected === "dark" ? "#090e1c" : "#f4f6fb";

    // YouTube's embedded chat supports a dark_theme URL flag. Reload the iframe
    // with the matching theme; the site can style the outer chat card separately.
    const chatFrame = document.getElementById("youtubeChatFrame");
    if (chatFrame) {
      const chatUrl = new URL("https://www.youtube.com/live_chat?v=rrMB8qkkNgs&embed_domain=sample.arivujaya0.workers.dev");
      if (selected === "dark") chatUrl.searchParams.set("dark_theme", "1");
      else chatUrl.searchParams.delete("dark_theme");
      const nextChatSrc = chatUrl.toString();
      if (chatFrame.src !== nextChatSrc) chatFrame.src = nextChatSrc;
    }
  }

  let savedTheme = "dark";
  try {
    const storedTheme = localStorage.getItem(THEME_KEY);
    if (storedTheme === "dark" || storedTheme === "light") savedTheme = storedTheme;
  } catch (error) {
    console.warn("Theme preference storage unavailable.");
  }
  applyTheme(savedTheme);

  themeToggle?.addEventListener("click", () => {
    const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(nextTheme);
    try {
      localStorage.setItem(THEME_KEY, nextTheme);
    } catch (error) {
      console.warn("Could not save theme preference.");
    }
  });

  document.getElementById("year").textContent = new Date().getFullYear();

  // Keep the playing video visible while viewers interact with embedded chat.
  const playerCard = document.querySelector(".player-card");
  const chatCard = document.querySelector(".chat-card");
  const returnToVideo = document.getElementById("chatReturnToVideo");
  if (playerCard && chatCard && window.matchMedia("(max-width: 620px)").matches) {
    const chatFrame = document.getElementById("youtubeChatFrame");
    chatFrame?.addEventListener("pointerdown", () => playerCard.classList.add("video-sticky"));
    chatCard.addEventListener("pointerdown", () => playerCard.classList.add("video-sticky"));
    if ("IntersectionObserver" in window) {
      const chatVisibility = new IntersectionObserver(entries => {
        const chatIsVisible = entries.some(entry => entry.isIntersecting);
        playerCard.classList.toggle("video-sticky", chatIsVisible);
      }, { threshold: 0.01 });
      chatVisibility.observe(chatCard);
    }
  }
  returnToVideo?.addEventListener("click", () => {
    playerCard?.classList.remove("video-sticky");
    playerCard?.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  /* =====================================
     VIDEO-AREA PLAY BUTTON + 6-MIN COOLDOWN
  ====================================== */

  const AD_REDIRECT_URL = "https://arwf.org/4/a20dc74bc92fb6072642a86814bf8e78";
  const VIDEO_PLAY_INTERVAL = 6 * 60 * 1000;

  const videoAdTapLayer = document.getElementById("videoAdTapLayer");
  const videoAdPlayButton = document.getElementById("videoAdPlayButton");
  const videoAdPlayLabel = document.getElementById("videoAdPlayLabel");

  let videoPlayTimer = null;
  let videoPlayButtonBusy = false;

  function setVideoPlayLabel(value) {
    if (videoAdPlayLabel) videoAdPlayLabel.textContent = value;
  }

  function openAdDestination() {
    if (!AD_REDIRECT_URL) return;
    try {
      window.open(AD_REDIRECT_URL, "_blank", "noopener,noreferrer");
    } catch (error) {
      console.warn("Popup blocked or failed:", error);
    }
  }
  window.openSlsAdDestination = openAdDestination;

  function showVideoPlayOverlay() {
    if (!videoAdTapLayer) return;
    if (videoPlayTimer) {
      clearTimeout(videoPlayTimer);
      videoPlayTimer = null;
    }
    videoAdTapLayer.hidden = false;
    videoAdTapLayer.style.display = "flex";
    videoPlayButtonBusy = false;
    setVideoPlayLabel("Play video");
  }

  function hideVideoPlayOverlayForCooldown() {
    if (!videoAdTapLayer) return;
    videoAdTapLayer.hidden = true;
    videoAdTapLayer.style.display = "none";

    if (videoPlayTimer) clearTimeout(videoPlayTimer);
    videoPlayTimer = setTimeout(() => {
      showVideoPlayOverlay();
    }, VIDEO_PLAY_INTERVAL);
  }

  if (videoAdTapLayer && videoAdPlayButton) {
    videoAdPlayButton.addEventListener("click", () => {
      if (videoPlayButtonBusy) return;
      videoPlayButtonBusy = true;

      openAdDestination();
      hideVideoPlayOverlayForCooldown();
    });

    showVideoPlayOverlay();
  }

  /* =====================================
     EMOJI REACTIONS
  ====================================== */

  const emojiRain = document.getElementById("emojiRain");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let lastReactionTime = 0;
  const REACTION_COOLDOWN = 700;
  const MAX_EMOJIS = 40;

  function createEmojiRain(emoji) {
    if (!emojiRain) return;

    if (reducedMotion) {
      const reaction = document.createElement("span");
      reaction.className = "falling-emoji reduced-motion-emoji";
      reaction.textContent = emoji;
      emojiRain.appendChild(reaction);
      window.setTimeout(() => reaction.remove(), 1000);
      return;
    }

    while (emojiRain.childElementCount + 16 > MAX_EMOJIS) {
      emojiRain.firstElementChild?.remove();
    }

    for (let i = 0; i < 16; i++) {
      const item = document.createElement("span");
      item.className = "falling-emoji";
      item.textContent = emoji;
      item.style.left = (Math.random() * 100) + "vw";
      item.style.fontSize = (21 + Math.random() * 17) + "px";
      item.style.setProperty("--duration", (1.8 + Math.random() * 1.5) + "s");
      item.style.setProperty("--drift", (Math.random() * 100 - 50) + "px");
      item.style.setProperty("--spin", (Math.random() * 600 - 300) + "deg");
      item.style.animationDelay = (Math.random() * .25) + "s";

      emojiRain.appendChild(item);
      item.addEventListener("animationend", () => item.remove(), { once: true });
    }
  }

  document.querySelectorAll("[data-emoji]").forEach(button => {
    button.addEventListener("click", () => {
      const now = Date.now();
      if (now - lastReactionTime < REACTION_COOLDOWN) return;
      lastReactionTime = now;
      createEmojiRain(button.dataset.emoji);
    });
  });
  </script>

  <script>
  /* Custom fullscreen video controls. */
  (() => {

    exitButton.type = "button";
    exitButton.className = "sls-fs-exit";
    exitButton.textContent = "← Exit";
    exitButton.setAttribute("aria-label", "Exit fullscreen video");
    player.appendChild(exitButton);

    function isCustomFullscreen() {
      return document.fullscreenElement === player ||
        player.classList.contains("sls-fullscreen-fallback");
    }

    function syncButton() {
      const active = isCustomFullscreen();
      fullscreenButton.textContent = active ? "✕ Exit fullscreen" : "⛶";
      fullscreenButton.setAttribute("aria-label", active ? "Exit fullscreen" : "Open fullscreen video");
    }

    exitButton.addEventListener("click", async () => {
      if (typeof window.openSlsAdDestination === "function") {
        window.openSlsAdDestination();
      }
      if (document.fullscreenElement === player && document.exitFullscreen) {
        try { await document.exitFullscreen(); } catch (e) {}
      } else {
        player.classList.remove("sls-fullscreen-fallback");
      }
      syncButton();
    });

    fullscreenButton.addEventListener("click", async () => {
      if (isCustomFullscreen()) {
        if (typeof window.openSlsAdDestination === "function") {
          window.openSlsAdDestination();
        }
        if (document.fullscreenElement === player && document.exitFullscreen) {
          try { await document.exitFullscreen(); } catch (e) {}
        } else {
          player.classList.remove("sls-fullscreen-fallback");
        }
        syncButton();
        return;
      }

      try {
        if (player.requestFullscreen) {
          await player.requestFullscreen();
        } else if (player.webkitRequestFullscreen) {
          player.webkitRequestFullscreen();
        } else {
          player.classList.add("sls-fullscreen-fallback");
        }
      } catch (error) {
        player.classList.add("sls-fullscreen-fallback");
      }
      syncButton();
      if (isCustomFullscreen()) addFullscreenChat();
    });

    let fsChatOverlay = null;
    function addFullscreenChat() {
      if (fsChatOverlay || !player) return;
      const source = document.getElementById("youtubeChatFrame");
      if (!source) return;
      fsChatOverlay = document.createElement("div");
      fsChatOverlay.className = "fs-chat-overlay";
      fsChatOverlay.setAttribute("aria-label", "Live Chat overlay");
      const label = document.createElement("div");
      label.className = "fs-chat-label";
      label.textContent = "LIVE CHAT";
      const chat = document.createElement("iframe");
      chat.title = "Live Chat";
      chat.src = source.src;
      chat.allow = "autoplay; encrypted-media";
      chat.referrerPolicy = "strict-origin-when-cross-origin";
      fsChatOverlay.append(label, chat);
      player.appendChild(fsChatOverlay);
    }
    function removeFullscreenChat() {
      fsChatOverlay?.remove();
      fsChatOverlay = null;
    }
    function handleFullscreenChange() {
      syncButton();
      if (isCustomFullscreen()) addFullscreenChat();
      else removeFullscreenChat();
    }
    document.addEventListener("fullscreenchange", handleFullscreenChange);
    document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
  })();
  </script>

</body>
</html>
